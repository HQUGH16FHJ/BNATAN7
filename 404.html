<style>
:root {
  --bg: #0a0805;
  --bg-deep: #050302;
  --text: #fff7ed;
  --sub: #d6c7b8;
  --sub-2: #8a7e72;
  --accent: #f59e0b;
  --accent-2: #fb7185;
  --accent-gold: #38bdf8;
  --border: rgba(245, 158, 11, 0.12);
  --card-bg: rgba(20, 15, 10, 0.5);
  --glass-blur: blur(24px) saturate(160%);
  --glow-color: 245, 158, 11;
  --grad-accent: linear-gradient(135deg, var(--accent), var(--accent-2));
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Outfit', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
}

body {
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 15%, rgba(245, 158, 11, 0.10) 0%, transparent 45%),
    radial-gradient(ellipse at 80% 75%, rgba(251, 113, 133, 0.08) 0%, transparent 45%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* 网格背景 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
  background-image:
    linear-gradient(rgba(245, 158, 11, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245, 158, 11, 0.025) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 75%);
}

/* 光晕球 */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: 0;
  mix-blend-mode: screen;
  will-change: transform;
}
@media (prefers-reduced-motion: no-preference) {
  .orb { animation: orbFloat 90s infinite alternate ease-in-out; }
}
@keyframes orbFloat {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(60px, -40px) scale(1.15); }
}
.orb-a {
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(245, 158, 11, 0.22), transparent 70%);
  top: -20%; left: -15%;
  opacity: 0.2;
}
.orb-b {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(251, 113, 133, 0.18), transparent 70%);
  bottom: -15%; right: -10%;
  opacity: 0.2;
  animation-duration: 100s;
  animation-delay: -30s;
}
.orb-c {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(251, 191, 36, 0.15), transparent 70%);
  top: 40%; right: -5%;
  opacity: 0.15;
  animation-duration: 110s;
  animation-delay: -60s;
}

/* 主容器 */
.wrap {
  position: relative;
  z-index: 1;
  width: min(92vw, 720px);
  text-align: center;
  padding: 40px 0;
}

/* Logo */
.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 40px;
  font-family: var(--font-display);
  font-size: clamp(16px, 2.5vw, 20px);
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.mark {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--grad-accent);
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  font-family: var(--font-display);
  box-shadow: 0 0 24px rgba(245, 158, 11, 0.35);
}
.logo-text {
  background: linear-gradient(135deg, #f59e0b, #fb7185);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 404 数字 */
.code {
  font-family: var(--font-display);
  font-size: clamp(100px, 22vw, 200px);
  font-weight: 900;
  line-height: 0.85;
  letter-spacing: -0.06em;
  background: linear-gradient(135deg, #fff7ed 15%, #f59e0b 48%, #fb7185 85%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 60px rgba(245, 158, 11, 0.15));
  margin-bottom: 8px;
}

/* 标题 */
h1 {
  font-family: var(--font-display);
  font-size: clamp(24px, 4.5vw, 40px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin: 24px 0 16px;
}
h1 .accent {
  background: var(--grad-accent);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 描述 */
.desc {
  color: var(--sub);
  font-size: clamp(14px, 1.6vw, 17px);
  line-height: 1.8;
  max-width: 480px;
  margin: 0 auto;
}

/* 路径面板 */
.panel {
  margin: 36px auto 0;
  padding: 24px 28px;
  max-width: 560px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow:
    0 18px 60px rgba(0, 0, 0, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 15%;
  right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.4), rgba(251, 113, 133, 0.3), transparent);
}
.path {
  display: block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--accent);
  font-family: 'SF Mono', 'Fira Code', ui-monospace, Consolas, monospace;
  font-size: 12px;
  letter-spacing: 0.02em;
  opacity: 0.85;
  margin-bottom: 20px;
  padding: 8px 12px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 8px;
}

.recovery-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: -8px 0 18px;
  color: var(--sub-2);
  font-size: 11px;
}
.recovery-status span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.recovery-status i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 10px rgba(52, 211, 153, 0.75);
}

/* 按钮 */
.actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
a, button {
  min-height: 44px;
  padding: 12px 28px;
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out), background 0.3s;
  border: none;
}
.primary {
  background: var(--grad-accent);
  color: #ffffff;
  box-shadow: 0 0 30px rgba(245, 158, 11, 0.25);
}
.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 40px rgba(245, 158, 11, 0.4);
}
.secondary {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text);
}
.secondary:hover {
  background: rgba(245, 158, 11, 0.12);
  border-color: rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
}

.recovery-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  text-align: left;
}
.recovery-link {
  display: flex;
  min-height: 68px;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 3px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, 0.065);
  border-radius: 12px;
  color: var(--text);
  background: rgba(255, 255, 255, 0.025);
}
.recovery-link strong {
  font-size: 13px;
  font-weight: 700;
}
.recovery-link span {
  color: var(--sub-2);
  font-size: 11px;
}
.recovery-link:hover {
  border-color: rgba(var(--glow-color), 0.24);
  background: rgba(var(--glow-color), 0.075);
}

/* 提示 */
.hint {
  margin-top: 28px;
  font-size: 13px;
  color: var(--sub-2);
  line-height: 1.7;
}

/* 底部 */
.footer {
  margin-top: 48px;
  font-size: 12px;
  color: var(--sub-2);
  letter-spacing: 0.05em;
  opacity: 0.7;
}

@media (max-width: 600px) {
  .actions { flex-direction: column; }
  a, button { width: 100%; }
  .recovery-grid { grid-template-columns: 1fr; }
  .panel { padding: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .orb { animation: none; }
}
</style>

<script>
document.getElementById('path').textContent =
  window.location.pathname + window.location.search;

const networkStatus = document.getElementById('networkStatus');
const updateNetworkStatus = () => {
  networkStatus.textContent = navigator.onLine ? '官方入口正常' : '网络连接已断开';
  networkStatus.previousElementSibling.querySelector('i').style.background =
    navigator.onLine ? '#34d399' : '#fb7185';
};
window.addEventListener('online', updateNetworkStatus);
window.addEventListener('offline', updateNetworkStatus);
updateNetworkStatus();

document.getElementById('openSearch').addEventListener('click', () => {
  if (window.BantanSearch?.open) window.BantanSearch.open({ query: '' });
  else window.location.href = './landing.html';
});
</script>

})();
