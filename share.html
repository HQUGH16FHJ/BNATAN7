<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#090704">
<link rel="canonical" href="https://bantan.online/share.html">

<title>OG 分享图生成器 · 绊谈</title>
</head>
<body class="site-page share-studio-page">
<nav class="site-topbar" aria-label="分享图生成器导航"><div class="site-topbar__inner"><a class="site-brand" href="./landing.html"><span class="site-brand__mark">绊</span><span>分享图生成器</span></a><div class="site-nav"><a href="./landing.html">首页</a><a href="./explore.html">探索</a><a href="./releases.html">发布</a><a href="./badge.html">徽章</a><a href="./qr.html">二维码</a><a href="./brand.html">品牌</a></div></div></nav>
<main class="site-shell share-studio">
  <header class="site-hero">
    <div class="site-kicker">Social Image Studio</div>
    <h1 class="site-title">生成一张<em>分享图</em></h1>
    <p class="site-lead">生成适合微信、QQ、GitHub、Twitter 使用的 1200×630 分享图。图片在浏览器本地生成。</p>
  </header>
  <section class="share-workbench">
    <form class="share-controls" id="shareControls">
      <label><span>标题</span><input id="shareTitle" value="绊谈 · 万能枢纽" maxlength="34"></label>
      <label><span>副标题</span><input id="shareSubtitle" value="600+ 免费在线工具一站直达" maxlength="48"></label>
      <label><span>类型</span><select id="shareType"><option value="site">官方网站</option><option value="release">版本发布</option><option value="rights">权属登记</option></select></label>
      <label><span>风格</span><select id="shareTheme"><option value="dark">深色</option><option value="amber">金色</option><option value="light">浅色</option></select></label>
      <button type="submit">更新分享图</button>
      <button type="button" id="downloadShareImage">下载 PNG</button>
    </form>
    <div class="share-preview">
      <canvas id="shareCanvas" width="1200" height="630"></canvas>
    </div>
  </section>
</main>
<footer class="site-footer"><div class="site-footer__inner"><span>© 2026 绊谈 Bantan</span><span><a href="./badge.html">认证徽章</a> · <a href="./qr.html">二维码证书</a> · <a href="./brand.html">品牌资产</a></span></div></footer>
