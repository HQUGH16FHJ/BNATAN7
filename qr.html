<body class="site-page qr-studio-page">
<nav class="site-topbar" aria-label="二维码生成器导航"><div class="site-topbar__inner"><a class="site-brand" href="./landing.html"><span class="site-brand__mark">绊</span><span>二维码证书</span></a><div class="site-nav"><a href="./landing.html">首页</a><a href="./explore.html">探索</a><a href="./badge.html">徽章</a><a href="./share.html">分享图</a><a href="./brand.html">品牌</a><a href="./releases.html">发布</a></div></div></nav>
<main class="site-shell qr-studio">
  <header class="site-hero">
    <div class="site-kicker">QR Certificate Studio</div>
    <h1 class="site-title">二维码<em>证书与贴纸</em></h1>
    <p class="site-lead">扫码直接打开网站首页。Bantan 二维码跳转到 bantan.online，刘骐硕二维码跳转到 llllkk.online。</p>
  </header>
  <section class="qr-workbench">
    <form class="qr-controls" id="qrControls">
      <label><span>网站</span><select id="qrSite"><option value="bantan">绊谈 · 万能枢纽</option><option value="llllkk">刘骐硕个人博客</option></select></label>
      <label><span>形状</span><select id="qrShape"><option value="square">方形贴纸</option><option value="round">圆形贴纸</option><option value="certificate">证书二维码</option></select></label>
      <label><span>颜色</span><select id="qrTheme"><option value="dark">深色</option><option value="light">浅色</option></select></label>
      <button type="submit">生成二维码</button>
      <button type="button" id="downloadQrSticker">下载贴纸 PNG</button>
    </form>
    <div class="qr-preview">
      <canvas id="qrCanvas" width="720" height="720"></canvas>
    </div>
  </section>
</main>
