<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>绊谈 OG Image</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Outfit', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0805;
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(245, 158, 11, 0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(251, 113, 133, 0.15) 0%, transparent 50%),
      linear-gradient(135deg, #0a0805 0%, #0f0c08 50%, #0a0805 100%);
    color: #fff7ed;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 网格纹理 */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(245, 158, 11, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245, 158, 11, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* 光晕 */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
  }
  .glow-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.4), transparent 70%);
    top: -200px; left: -100px;
  }
  .glow-2 {
    width: 450px; height: 450px;
    background: radial-gradient(circle, rgba(251, 113, 133, 0.35), transparent 70%);
    bottom: -180px; right: -80px;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 0 80px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
  }

  .left { flex: 1; }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
  }
  .logo-icon {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: linear-gradient(135deg, #f59e0b, #fb7185);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 900;
    color: #ffffff;
    box-shadow: 0 0 50px rgba(245, 158, 11, 0.6), 0 0 100px rgba(251, 113, 133, 0.3);
  }
  .logo-text {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff7ed;
  }
  .logo-text .accent {
    background: linear-gradient(135deg, #f59e0b, #fb7185);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  h1 {
    font-size: 68px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    color: #fff7ed;
  }
  h1 .accent {
    background: linear-gradient(135deg, #f59e0b 0%, #fb7185 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 24px;
    color: #d6c7b8;
    line-height: 1.5;
    max-width: 560px;
    margin-bottom: 32px;
  }

  .url {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    border-radius: 100px;
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    font-size: 18px;
    font-weight: 600;
    color: #f59e0b;
    letter-spacing: 0.02em;
  }
  .url-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f59e0b;
    box-shadow: 0 0 12px #f59e0b;
  }

  /* 右侧数字 */
  .right {
    flex-shrink: 0;
    text-align: center;
  }
  .big-num {
    font-size: 180px;
    font-weight: 900;
    line-height: 0.9;
    background: linear-gradient(135deg, #f59e0b, #fb7185);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.05em;
    filter: drop-shadow(0 0 40px rgba(245, 158, 11, 0.4));
  }
  .big-num-label {
    font-size: 20px;
    color: #8a7e72;
    margin-top: 8px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

</style>
  <link rel="stylesheet" href="./device-compat-v1.css?v=1.1.2">
  <link rel="stylesheet" href="./archive-interface-v1.css?v=1.0.3">
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="content">
    <div class="left">
      <div class="logo-row">
        <div class="logo-icon">绊</div>
        <div class="logo-text">绊谈<span class="accent">·</span>万能枢纽</div>
      </div>
      <h1>600+ <span class="accent">实用工具</span><br>一站直达</h1>
      <p class="subtitle">AI 对话 · 翻译 · 塔罗占卜 · 开发者工具 · 影音处理 · 教育学习</p>
      <div class="url">
        <span class="url-dot"></span>
        bantan.online
      </div>
    </div>
    <div class="right">
      <div class="big-num">600+</div>
      <div class="big-num-label">TOOLS</div>
    </div>
  </div>
  <script src="./device-compat-v1.js?v=1.1.3" defer></script>
</body>
</html>
