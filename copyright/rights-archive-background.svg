<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Bantan Rights 档案馆背景</title>
  <desc id="desc">深色档案纸、金色安全线、蓝色网格和淡化权属水印</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b0907"/>
      <stop offset=".48" stop-color="#070605"/>
      <stop offset="1" stop-color="#040403"/>
    </linearGradient>
    <radialGradient id="amber" cx="14%" cy="2%" r="72%">
      <stop stop-color="#f59e0b" stop-opacity=".18"/>
      <stop offset=".48" stop-color="#f59e0b" stop-opacity=".04"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="88%" cy="16%" r="66%">
      <stop stop-color="#38bdf8" stop-opacity=".13"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".025"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f59e0b" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <pattern id="micro" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".65" fill="#fff7ed" fill-opacity=".045"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f59e0b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1200" fill="url(#base)"/>
  <rect width="1920" height="1200" fill="url(#amber)"/>
  <rect width="1920" height="1200" fill="url(#blue)"/>
  <rect width="1920" height="1200" fill="url(#grid)"/>
  <rect width="1920" height="1200" fill="url(#micro)"/>

  <g opacity=".24" fill="none" stroke="#f59e0b">
    <path d="M0 196h1920" stroke-opacity=".09"/>
    <path d="M0 1018h1920" stroke-opacity=".09"/>
    <path d="M126 0v1200" stroke-opacity=".045"/>
    <path d="M1794 0v1200" stroke-opacity=".045"/>
  </g>

  <g opacity=".12" fill="none" stroke="url(#line)" stroke-width="2">
    <path d="M0 158C330 102 560 224 810 168s450-94 700 0 410 68 410 68"/>
    <path d="M0 1052c300 62 525-48 790 14s480 78 755-8 375-62 375-62"/>
  </g>

  <g transform="translate(1330 120) rotate(8)" opacity=".035">
    <circle cx="220" cy="220" r="198" fill="none" stroke="#fff7ed" stroke-width="8"/>
    <circle cx="220" cy="220" r="154" fill="none" stroke="#fff7ed" stroke-width="3" stroke-dasharray="9 13"/>
    <path d="M220 42 250 184l141 36-141 36-30 142-30-142-141-36 141-36Z" fill="none" stroke="#fff7ed" stroke-width="5"/>
  </g>

  <text x="70" y="1080" fill="#fff7ed" fill-opacity=".022" font-family="Georgia, serif" font-size="320" font-weight="700" letter-spacing="-18">RIGHTS</text>
  <text x="1504" y="340" fill="#38bdf8" fill-opacity=".035" font-family="Consolas, monospace" font-size="56" font-weight="700" letter-spacing="10">ARCHIVE</text>
  <text x="1512" y="394" fill="#f59e0b" fill-opacity=".04" font-family="Consolas, monospace" font-size="18" font-weight="700" letter-spacing="8">PRIVATE REGISTRY 2026</text>

  <ellipse cx="1560" cy="220" rx="420" ry="220" fill="#38bdf8" fill-opacity=".035" filter="url(#soft)"/>
  <ellipse cx="160" cy="980" rx="420" ry="240" fill="#f59e0b" fill-opacity=".045" filter="url(#soft)"/>
</svg>
